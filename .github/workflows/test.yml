name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pure-crypto + store/policy/audit tests: zero host peers needed, so this
  # matrix runs anywhere (including CI).
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/crypto.test.mjs test/totp.test.mjs test/strength.test.mjs test/generate.test.mjs test/mask.test.mjs test/store.test.mjs test/policy.test.mjs test/audit.test.mjs test/breach.test.mjs

  # Host-integration suites (tools/contracts/client/lifecycle/hardening) need
  # the @deepseek-ai/* peer packages, which ship inside a DSH installation and
  # are not on npm. CI cannot resolve them, so this job only runs when a peer
  # root is explicitly provided (self-hosted runner or manual dispatch with
  # VAULTX_PEER_ROOT). Locally: `node scripts/link-peers.mjs && pnpm test`.
  host:
    if: ${{ vars.VAULTX_PEER_ROOT != '' }}
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/link-peers.mjs
        env:
          VAULTX_PEER_ROOT: ${{ vars.VAULTX_PEER_ROOT }}
      - run: node --test test/tools.test.mjs test/contracts.test.mjs test/client.test.mjs test/lifecycle.test.mjs test/hardening.test.mjs
