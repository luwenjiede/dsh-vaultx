name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/crypto.test.mjs test/totp.test.mjs test/strength.test.mjs test/generate.test.mjs test/mask.test.mjs test/store.test.mjs test/policy.test.mjs test/audit.test.mjs test/breach.test.mjs

  host:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile || npm install --no-audit --no-fund || true
      - run: node scripts/link-peers.mjs
      - run: pnpm test
